<text x="118.5" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#ff6b6b">26</text>
<text x="118.5" y="108" text-anchor="middle" font-size="14.5" fill="#cfe6ee">人在 El Torno 洪灾中</text>
<text x="118.5" y="127" text-anchor="middle" font-size="14.5" fill="#cfe6ee">遇难（2025.12.13）</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.6s" fill="freeze"/>
<rect x="237.0" y="18" width="205.0" height="134" rx="12" fill="#0c2230" stroke="#5ee6f0" stroke-opacity=".35"/>
