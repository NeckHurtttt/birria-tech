<text x="560.5" y="127" text-anchor="middle" font-size="14.5" fill="#cfe6ee">确认已安全</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.90s" dur="0.6s" fill="freeze"/>
<rect x="679.0" y="18" width="205.0" height="134" rx="12" fill="#0c2230" stroke="#4fe39a" stroke-opacity=".35"/>
<rect x="679.0" y="18" width="205.0" height="4" rx="2" fill="#4fe39a"/>
<text x="781.5" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#4fe39a">0 Bs</text>
<text x="781.5" y="108" text-anchor="middle" font-size="14.5" fill="#cfe6ee">家庭零费用，</text>
<text x="781.5" y="127" text-anchor="middle" font-size="14.5" fill="#cfe6ee">可离线运行</text>
