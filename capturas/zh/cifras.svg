</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.6s" fill="freeze"/>
<rect x="458.0" y="18" width="205.0" height="134" rx="12" fill="#0c2230" stroke="#ffb347" stroke-opacity=".35"/>
<rect x="458.0" y="18" width="205.0" height="4" rx="2" fill="#ffb347"/>
<text x="560.5" y="76" text-anchor="middle" font-size="40" font-weight="800" fill="#ffb347">一键</text>
