<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" font-family="Segoe UI, Helvetica, Arial, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06121c"/><stop offset="1" stop-color="#0b2233"/></linearGradient>
  </defs>
<rect width="900" height="170" rx="16" fill="url(#cielo)"/>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.6s" fill="freeze"/>
<rect x="16.0" y="18" width="205.0" height="134" rx="12" fill="#0c2230" stroke="#ff6b6b" stroke-opacity=".35"/>
