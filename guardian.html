  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } .visto path { stroke-dashoffset: 0; } }

  if (!mapa) return;
  const lons = [...CUENCA.map(c => c.lon), SENSOR.lon, b.lon], lats = [...CUENCA.map(c => c.lat), SENSOR.lat, b.lat];
  mapa.map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]], { padding: { top: 40, bottom: 30, left: 30, right: 30 }, duration: 1200 });
}
function pintarRuta() {
  const llueve = lectura?.puntos?.length ? Math.max(...lectura.puntos.map(x => Number(x.ll24) || 0)) : null;
  $('#r-lluvia').textContent = llueve == null ? '–' : `${llueve.toFixed(1)} mm`;
  $('#r-km').textContent = `${b.km} km`;
  $('#r-barrio').textContent = b.nombre;
  if (!mapa) return;
  document.querySelectorAll('.marca.barrio').forEach(d => d.classList.toggle('mio', d.querySelector('b')?.textContent === b.nombre));
  mapa.lluvias?.forEach(({ c, d }) => { const pt = lectura?.puntos?.find(x => x.nombre === c.nombre); d.querySelector('.cr').textContent = pt ? `${Number(pt.ll24).toFixed(1)} mm` : '–'; });
  mapa.destacar(b.id);
  if (!crecida) BARRIOS.forEach(x => mapa.barrio(x.id, x.id === b.id ? `${formatoTiempo(LAG_CUENCA_MIN + minutosHasta(x))} si crece` : 'sin alerta', 'tranquilo'));
}

// ---------- río ahora (vigía central: la PC del equipo sube una lectura cada 10 min) ----------
function tarjetaRio() {
  if (!rio) return `<div class="tarjeta entra" id="rio"><span class="etiqueta">El río ahora</span><span class="estado sin">sin datos</span>
    <p class="fuente">Esperando la lectura del vigía central…</p>${lineaOficial()}</div>`;
  return `<div class="tarjeta entra" id="rio"><span class="etiqueta">El río ahora</span><span class="estado ${rio.estado}">${rio.estado}</span>
    <div class="rio"><div><strong>${rio.caudal}</strong><small>m³/s caudal</small></div><div><strong>${rio.ll24}</strong><small>mm lluvia 24 h</small></div><div><strong>${rio.indice}</strong><small>riesgo /100</small></div></div>
    <p class="fuente">${rio.central ? `Vigía central · hace ${rio.minutos} min` : 'Datos abiertos de la cuenca alta · Open-Meteo y GloFAS'}</p>${lineaOficial()}</div>`;
}
function lineaOficial() {
  return oficial ? `<p class="oficial" data-n="${oficial.nivel}"><i></i><span>${esc(textoOficial(oficial))}</span></p>` : '';
}
async function leerRio() {
  oficial = amenazaHoy(await cargarSenamhi('datos/senamhi.json')) || oficial;
  try {
    // primero la PC del equipo (vigía central); si no hay lectura fresca, el celular consulta los datos abiertos
    let l = null, central = false;
    if (hayNube()) { try { l = deLectura(await vigiaCentral.ultima()); central = !!l; } catch {} }
    if (!l) { const e = await escanear(); if (e.vivo) l = { ...e, caudal: e.caudal ?? e.caudalPico }; }
    if (l) {
      lectura = l;
      const r = indiceRiesgo({ ll6: l.ll6, ll24: l.ll24, prox6: l.prox6, caudal: l.caudal, oficial: oficial?.nivel });
      rio = { estado: r.estado, indice: Math.round(r.r * 100), caudal: Number(l.caudal || 0).toFixed(1), ll24: Number(l.ll24).toFixed(1), minutos: l.minutos, central };
      if (!document.body.classList.contains('alerta') && !document.body.classList.contains('salvo')) document.body.className = r.estado === 'normal' ? '' : 'vigilancia';
    }
  } catch {}
  const t = $('#rio'); if (t) t.outerHTML = tarjetaRio().replace(' entra', '');
  pintarRuta();
}

// ---------- espera ----------
function botonAvisos() {
  return `<button id="activar" class="${activo ? 'activo' : 'pulso-btn'}">${activo ? 'Avisos activados ✓' : 'Activar avisos'}</button>
    ${activo ? `<div class="escucha"><span class="latido"></span><span>Escuchando al río</span></div><button class="sec" id="probar">Probar sonido</button>`
             : `<p style="margin-top:12px">Deja esta pantalla abierta. Si el río suena, este celular va a sonar y vibrar.</p>`}`;
}
function esperar() {
  document.body.className = rio && rio.estado !== 'normal' ? 'vigilancia' : '';
  const cabeza = vecino
    ? `<h1 class="entra">El río y tu barrio</h1>
       <div class="tarjeta entra"><span class="etiqueta">Tu barrio</span><div class="barrios">${BARRIOS.map(x => `<button data-b="${x.id}" aria-pressed="${x.id === b.id}">${x.nombre}</button>`).join('')}</div></div>`
    : `<h1 class="entra">Eres ayudante de ${p.nombre}</h1>
       <div class="tarjeta entra"><div class="persona"><div class="avatar" aria-hidden="true">${silueta}</div>
       <div><b>${p.nombre}</b><span>${b.nombre} · ${p.cuadra}</span><br><span class="chip">${p.necesidad}</span></div></div></div>`;
  const pie = vecino
    ? `${tema ? '' : '<p class="nota-vecino">Para que este celular suene con la alerta de tu comunidad, escanea el código QR de tu junta vecinal.</p>'}<button class="sec" id="ser-guardian">Quiero ser ayudante de alguien</button>`
    : `<button class="sec" id="solo-ver">Solo quiero ver el río</button>`;
  vista.innerHTML = `${cabeza}${tarjetaRio()}<div class="entra">${botonAvisos()}${pie}${extrasApp()}</div>`;
  $('#activar').onclick = async () => {
    activo = true;
    // un solo AudioContext: el navegador limita cuántos puede haber abiertos
    try { sonido ??= new (window.AudioContext || window.webkitAudioContext)(); sonido.resume(); } catch {}
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch {}
    despertar(); navigator.vibrate?.(80);
    esperar();
  };
  $('#probar')?.addEventListener('click', () => { sirena(1); navigator.vibrate?.([200, 100, 200]); });
  $('#solo-ver')?.addEventListener('click', () => { const u = new URL(location.href); u.searchParams.set('modo', 'vecino'); u.searchParams.set('b', b.id); u.searchParams.delete('p'); location.href = u; });
  $('#ser-guardian')?.addEventListener('click', () => { const u = new URL(location.href); u.searchParams.delete('modo'); u.searchParams.delete('b'); location.href = u; });
  document.querySelectorAll('.barrios button').forEach(x => x.onclick = () => {
    b = BARRIOS.find(y => y.id === x.dataset.b); try { localStorage.setItem('rs-barrio', b.id); } catch {}
    document.querySelectorAll('.barrios button').forEach(y => y.setAttribute('aria-pressed', String(y === x)));
    pintarRuta(); encuadrar();
  });
  iniciarMapa();
}
// ---------- app en el celular: instalar y sonar con la pantalla bloqueada ----------
let pedirInstalar = null;
const instalada = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedirInstalar = e; const x = $('#instalar'); if (x) x.hidden = false; });
addEventListener('appinstalled', () => { pedirInstalar = null; const x = $('#instalar'); if (x) x.hidden = true; });
function extrasApp() {
  const ntfy = tema ? `<button class="sec" id="ntfy">Que suene con el celular bloqueado</button>
    <p>Usa la app gratuita ntfy: el aviso llega aunque la pantalla esté apagada.
    ${esIOS ? '<a href="https://apps.apple.com/app/ntfy/id1625396347" target="_blank" rel="noopener">Bajar ntfy</a>' : '<a href="https://play.google.com/store/apps/details?id=io.heckel.ntfy" target="_blank" rel="noopener">Bajar ntfy</a>'}
    · tema <b>${esc(tema)}</b></p>` : '';
  const inst = instalada() ? '' : `<button class="sec" id="instalar" ${pedirInstalar ? '' : 'hidden'}>Instalar como app</button>
    ${esIOS ? '<p>Para instalarla: botón Compartir y luego «Agregar a inicio».</p>' : ''}`;
  return ntfy || inst.trim() ? `<div class="app-extra">${inst}${ntfy}</div>` : '';
}
document.addEventListener('click', async e => {
  if (e.target.closest('#instalar') && pedirInstalar) { pedirInstalar.prompt(); await pedirInstalar.userChoice.catch(() => {}); pedirInstalar = null; e.target.closest('#instalar').hidden = true; }
  if (e.target.closest('#ntfy')) location.href = `ntfy://ntfy.sh/${tema}`;
});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

// la pantalla no se apaga mientras espera; al volver a la pestaña el navegador suelta el bloqueo
async function despertar() { try { await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (activo && document.visibilityState === 'visible') despertar(); });

function sirena(seg = 3) {
  if (!sonido || sonido.state === 'closed') return;
  sonido.resume?.();
  const o = sonido.createOscillator(), g = sonido.createGain(), t = sonido.currentTime;
  o.type = 'sawtooth'; g.gain.value = 0.15; o.connect(g).connect(sonido.destination);
  for (let i = 0; i < seg * 2; i++) { o.frequency.setValueAtTime(700, t + i * 0.5); o.frequency.linearRampToValueAtTime(1100, t + i * 0.5 + 0.25); }
  o.start(t); o.stop(t + seg); o.onended = () => { o.disconnect(); g.disconnect(); };
}

// ---------- alerta: la crecida avanza en el mapa desde La Angostura ----------
function avanzarCrecida() {
  if (!crecida || !mapa) return;
  const min = (Date.now() - crecida.t0) / 6e4 + crecida.sim - crecida.lag; // minutos desde que el frente pasó La Angostura
  const km = Math.max(0, min / 60 * velocidad(crecida.i));
  mapa.crecida(km); mapa.sensor(min >= 0 ? 'crecida' : '');
  BARRIOS.forEach(x => {
    const falta = Math.round(minutosHasta(x, crecida.i, crecida.lag) - crecida.sim - (Date.now() - crecida.t0) / 6e4);
    mapa.barrio(x.id, falta <= 0 ? 'llegó el agua' : formatoTiempo(falta), falta <= 0 ? 'llego' : 'alerta');
  });
}
function alerta({ min, titulo, ayuda }) {
  document.body.className = 'alerta'; navigator.vibrate?.([600, 200, 600, 200, 600]); sirena();
  const total = Math.max(0, Number(min) || 0) * 60, fin = Date.now() + total * 1000, L = 2 * Math.PI * 87;
  vista.innerHTML = `<h1>${titulo}</h1>${ayuda}
    <div class="reloj" role="timer" aria-live="off"><svg viewBox="0 0 200 200"><circle class="pista" cx="100" cy="100" r="87"/><circle class="arco" id="arco" cx="100" cy="100" r="87" stroke-dasharray="${L}" stroke-dashoffset="0"/></svg>
      <div class="cifra"><strong id="cuenta">${formatoTiempo(Number(min))}</strong><span>El agua llega en</span></div></div>
    ${vecino
      ? `<div class="tarjeta"><ol class="pasos"><li>Avisa a tu familia y vecinos</li><li>Sube a la loma de la plaza principal</li><li>Ayuda a quien no pueda caminar</li></ol></div>`
      : `<div class="tarjeta"><ol class="pasos"><li>Ve ahora a su casa</li><li>Vayan juntos a la loma de la plaza principal</li><li>Cuando estén a salvo, toca el botón verde</li></ol></div>
         <button class="ok" id="ok">Listo, a salvo ✓</button>`}`;
  clearInterval(reloj);
  const tic = () => {
    const s = Math.max(0, Math.round((fin - Date.now()) / 1000)), c = $('#cuenta'), a = $('#arco');
    if (!c) return clearInterval(reloj);
    c.textContent = s <= 0 ? formatoTiempo(0) : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    if (a && total) a.style.strokeDashoffset = String(L * (1 - s / total));
    avanzarCrecida();
    if (s <= 0 && !crecida) clearInterval(reloj);
  };
  tic(); reloj = setInterval(tic, 1000);
  iniciarMapa();
  if (mapa) mapa.tramo(b);
  $('#ok')?.addEventListener('click', () => {
    // la pantalla responde al instante; el envío por internet sigue en segundo plano
    canal.enviar({ tipo: 'ok', id: p.id }, { titulo: `${p.nombre}: a salvo`, texto: `Confirmado por ${p.guardian}` });
    salvo(`${p.nombre} está a salvo. La central ya lo sabe.`, '¡Gracias!');
  });
}
function alertaGuardian(m) {
  // acuse silencioso: la central ve que el celular sonó, antes del «a salvo»
  canal.enviar({ tipo: 'recibido', id: p.id }, { titulo: `${p.nombre}: aviso recibido`, texto: `Celular de ${p.guardian}`, prioridad: 1 });
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification(`Crecida: ayuda a ${p.nombre}`, { body: `El agua llega en ${formatoTiempo(Number(m.min))}` }); } catch {}
  // sin aviso general (central vieja): el frente se estima desde los minutos que faltan a su barrio
  crecida ??= { i: 1, lag: 0, sim: Math.max(0, minutosHasta(b) - Number(m.min)), t0: Date.now() };
  alerta({ min: m.min, titulo: '¡El río suena!', ayuda: `<p>Ayuda a <b>${p.nombre}</b> (${p.necesidad})<br>${b.nombre}, ${p.cuadra}</p>` });
}
function alertaVecino() {
  const min = Math.max(0, Math.round(minutosHasta(b, crecida.i, crecida.lag) - crecida.sim));
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Crecida del Piraí', { body: `El agua llega a ${b.nombre} en ${formatoTiempo(min)}` }); } catch {}
  alerta({ min, titulo: '¡El río suena!', ayuda: `<p>El agua viene río abajo hacia <b>${b.nombre}</b></p>` });
}
function salvo(texto, titulo = `${p.nombre} está a salvo`) {
  clearInterval(reloj); navigator.vibrate?.(0); document.body.className = 'salvo';
  vista.innerHTML = `<svg class="visto" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54"/><path d="M38 62l15 15 30-32"/></svg>
    <h1>${titulo}</h1><p>${texto}</p>`;
}
function cancelada() {
  clearInterval(reloj); navigator.vibrate?.(0); crecida = null; document.body.className = 'salvo';
  vista.innerHTML = `<svg class="visto" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54"/><path d="M38 62l15 15 30-32"/></svg>
    <h1>Alerta cancelada</h1><p>Falsa alarma: la junta verificó el río y está normal. Gracias por estar atentos.</p>
    <button class="sec" id="volver">Volver</button>`;
  $('#volver').onclick = esperar;
}
const canal = !tema ? null : abrirCanal(tema, m => {
  if (m.tipo === 'cancelar') { if (document.body.classList.contains('alerta')) cancelada(); else crecida = null; return; }
  if (m.tipo === 'crecida') {
    crecida = { i: Number(m.i) || 1, lag: Number(m.lag) || 0, sim: Number(m.sim) || 0, t0: Date.now() };
    if (vecino && !document.body.classList.contains('alerta')) alertaVecino();
  }
  if (vecino) return;
  if (m.tipo === 'alerta' && m.id === p.id) alertaGuardian(m);
  if (m.tipo === 'ok' && m.id === p.id && document.body.classList.contains('alerta')) salvo('Confirmado desde la central.');
});
function sinCodigo() {
  vista.innerHTML = `<h1>Falta el código</h1><p>Escanee el código QR que muestra la central (botón «Sé ayudante») o pegue aquí el enlace o el código recibido.</p>
    <div class="tarjeta"><label for="codigo">Enlace o código de la central</label><input id="codigo" autocomplete="off" placeholder="rio-suena-xxxxxxxx"></div>
    <button id="entrar">Continuar</button><button class="sec" id="solo-mirar">Solo quiero ver el río</button><p style="margin-top:16px"><a href="./">Abrir la central</a></p>`;
  $('#solo-mirar').onclick = () => { location.search = '?modo=vecino'; };
  const ir = () => {
    const v = $('#codigo').value.trim(); if (!v) return;
    try { const u = new URL(v); if (u.searchParams.get('t')) { location.search = u.search; return; } } catch {}
    const t = limpiarTema(v); if (t) location.search = `?t=${t}&p=${PERSONAS[0].id}`;
  };
  $('#entrar').onclick = ir;
  $('#codigo').onkeydown = e => { if (e.key === 'Enter') ir(); };
}
if (!tema && !vecino) sinCodigo(); else { esperar(); leerRio(); setInterval(leerRio, 120000); }
</script>
