<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardián · El Río Suena</title>
<meta name="theme-color" content="#071219">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/fuentes.css">
<style>
  :root { --fondo:#071219; --sup:#0c1f2b; --borde:rgba(91,231,240,.16); --texto:#e7f4f7; --texto-2:#9db6bf; --acento:#5be7f0; --alerta:#ff5a4a; --exito:#4fe39a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--fondo); color: var(--texto); font: 16px/1.5 "Space Grotesk", system-ui, sans-serif; display: grid; place-items: center; padding: 16px; transition: background .3s; }
  body.alerta { background: #3a0c0a; animation: late 1s infinite; }
  body.salvo { background: #06281b; animation: none; }
  .caja { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 28px; margin: 8px 0; } p { color: var(--texto-2); margin: 0 0 16px; }
  .tarjeta { background: var(--sup); border: 1px solid var(--borde); border-radius: 16px; padding: 24px 16px; margin: 16px 0; }
  .grande { font: 700 44px "JetBrains Mono", monospace; color: #fff; }
  button { width: 100%; min-height: 64px; border: 0; border-radius: 14px; font: 700 20px "Space Grotesk", sans-serif; cursor: pointer; background: var(--acento); color: #04222a; }
  button.ok { background: var(--exito); color: #03281a; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  svg { width: 56px; height: 56px; fill: none; stroke: var(--acento); stroke-width: 2; stroke-linecap: round; }
  input { width: 100%; min-height: 48px; margin-top: 8px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--borde); background: #071219; color: var(--texto); font: 16px "Space Grotesk", sans-serif; }
  label { color: var(--texto-2); font-size: 14px; }
  a { color: var(--acento); }
  @keyframes late { 50% { background: #5a1410; } }
  @media (prefers-reduced-motion: reduce) { body.alerta { animation: none; } }
</style>
</head>
<body>
<main class="caja">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 20c4-4 6 4 10 0s6 4 10 0 5 2 6 1"/><path d="M10 11a6 6 0 0 1 12 0"/></svg>
  <div id="vista"></div>
</main>
<script type="module">
import { PERSONAS, BARRIOS, formatoTiempo } from './js/datos.js';
import { abrirCanal, limpiarTema } from './js/canal.js';
// un enlace mal copiado (p= desconocido o t= con símbolos) no debe dejar la pantalla en blanco
const q = new URLSearchParams(location.search), tema = limpiarTema(q.get('t'));
const deEnlace = () => q.get('n') && BARRIOS.some(x => x.id === q.get('b'))
  ? { id: q.get('p'), nombre: q.get('n').slice(0, 60), necesidad: (q.get('nec') || '').slice(0, 80), barrio: q.get('b'), cuadra: (q.get('cu') || '').slice(0, 40), guardian: (q.get('g') || 'guardián').slice(0, 60) } : null;
const p = PERSONAS.find(x => x.id === q.get('p')) || deEnlace() || PERSONAS[0];
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
for (const k of ['nombre', 'necesidad', 'cuadra', 'guardian']) p[k] = esc(p[k]);
const b = BARRIOS.find(x => x.id === p.barrio), vista = document.getElementById('vista');
let activo = false, sonido;
function esperar() {
  document.body.className = '';
  vista.innerHTML = `<h1>Eres guardián de ${p.nombre}</h1><p>${b.nombre}, ${p.cuadra} · ${p.necesidad}</p>
    <div class="tarjeta"><p>Deja esta pantalla abierta. Si el río suena, este celular va a sonar y vibrar.</p></div>
    <button id="activar">${activo ? 'Avisos activados ✓' : 'Activar avisos'}</button>`;
  document.getElementById('activar').onclick = () => {
    activo = true;
    // un solo AudioContext: el navegador limita cuántos puede haber abiertos
    try { sonido ??= new (window.AudioContext || window.webkitAudioContext)(); sonido.resume(); } catch {}
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch {}
    esperar();
  };
}
function sirena() {
  if (!sonido || sonido.state === 'closed') return;
  sonido.resume?.();
  const o = sonido.createOscillator(), g = sonido.createGain(), t = sonido.currentTime;
  o.type = 'sawtooth'; g.gain.value = 0.15; o.connect(g).connect(sonido.destination);
  for (let i = 0; i < 6; i++) { o.frequency.setValueAtTime(700, t + i * 0.5); o.frequency.linearRampToValueAtTime(1100, t + i * 0.5 + 0.25); }
  o.start(t); o.stop(t + 3); o.onended = () => { o.disconnect(); g.disconnect(); };
}
function alerta(m) {
  document.body.className = 'alerta'; navigator.vibrate?.([600, 200, 600, 200, 600]); sirena();
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification(`Crecida: ayuda a ${p.nombre}`, { body: `El agua llega en ${formatoTiempo(Number(m.min))}` }); } catch {}
  vista.innerHTML = `<h1>¡El río suena!</h1><p>Ayuda a <b>${p.nombre}</b> (${p.necesidad})<br>${b.nombre}, ${p.cuadra}</p>
    <div class="tarjeta"><p>El agua llega en</p><div class="grande">${formatoTiempo(Number(m.min))}</div><p>Punto seguro: la loma de la plaza principal</p></div>
    <button class="ok" id="ok">Ya la ayudé ✓</button>`;
  document.getElementById('ok').onclick = () => {
    // la pantalla responde al instante; el envío por internet sigue en segundo plano
    canal.enviar({ tipo: 'ok', id: p.id }, { titulo: `${p.nombre}: a salvo`, texto: `Confirmado por ${p.guardian}` });
    navigator.vibrate?.(0); document.body.className = 'salvo';
    vista.innerHTML = `<h1>¡Gracias!</h1><p>${p.nombre} está a salvo. La central ya lo sabe.</p>`;
  };
}
const canal = !tema ? null : abrirCanal(tema, m => { if (m.tipo === 'alerta' && m.id === p.id) alerta(m); if (m.tipo === 'ok' && m.id === p.id && document.body.className === 'alerta') { document.body.className = 'salvo'; vista.innerHTML = `<h1>${p.nombre} está a salvo</h1><p>Confirmado desde la central.</p>`; } });
function sinCodigo() {
  vista.innerHTML = `<h1>Falta el código</h1><p>Escanee el código QR que muestra la central (botón «Sé guardián») o pegue aquí el enlace o el código recibido.</p>
    <div class="tarjeta"><label for="codigo">Enlace o código de la central</label><input id="codigo" autocomplete="off" placeholder="rio-suena-xxxxxxxx"></div>
    <button id="entrar">Continuar</button><p style="margin-top:16px"><a href="./">Abrir la central</a></p>`;
  const ir = () => {
    const v = document.getElementById('codigo').value.trim(); if (!v) return;
    try { const u = new URL(v); if (u.searchParams.get('t')) { location.search = u.search; return; } } catch {}
    const t = limpiarTema(v); if (t) location.search = `?t=${t}&p=${PERSONAS[0].id}`;
  };
  document.getElementById('entrar').onclick = ir;
  document.getElementById('codigo').onkeydown = e => { if (e.key === 'Enter') ir(); };
}
if (!tema) sinCodigo(); else esperar();
</script>
</body>
</html>
