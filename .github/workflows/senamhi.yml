name: Boletín SENAMHI
# Lee el boletín hidrológico de Santa Cruz (cuenca del Piraí) y actualiza datos/senamhi.json.
# SENAMHI publica de lunes a viernes; se revisa dos veces al día (10:30 y 16:30, hora de Bolivia).
on:
  schedule:
    - cron: '30 14,20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  boletin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils
      - run: python3 herramientas/senamhi.py
      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/senamhi.json
          git diff --cached --quiet || (git commit -m "SENAMHI: boletín $(jq -r .boletin datos/senamhi.json)" && git push)
